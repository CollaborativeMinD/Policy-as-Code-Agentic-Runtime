name: Policy runtime qualification
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: station-linux
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        env:
          CHECKOUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          import subprocess

          if os.getuid() == 0 or Path("/var/run/docker.sock").exists():
              raise SystemExit("Unexpected runner permissions")
          revision = os.environ["GITHUB_SHA"]
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["CHECKOUT_TOKEN"]
          auth = base64.b64encode(f"x-access-token:{token}".encode()).decode()
          fetch_env = dict(os.environ, GIT_CONFIG_COUNT="1", GIT_CONFIG_KEY_0="http.extraHeader",
                           GIT_CONFIG_VALUE_0=f"Authorization: Basic {auth}", GIT_TERMINAL_PROMPT="0")
          subprocess.run(["git", "init", "-q", "checkout"], check=True)
          subprocess.run(["git", "-C", "checkout", "fetch", "-q", "--depth=1",
                          f"http://forgejo:3000/{repository}.git", revision], check=True, env=fetch_env)
          subprocess.run(["git", "-C", "checkout", "checkout", "-q", "--detach", "FETCH_HEAD"], check=True)
          actual = subprocess.check_output(["git", "-C", "checkout", "rev-parse", "HEAD"], text=True).strip()
          if actual != revision:
              raise SystemExit("Checkout SHA mismatch")
          print(f"Verified revision {actual}")
          PY
      - name: Run tracer, admission tests, and inventory witness
        working-directory: checkout
        run: |
          set -eu
          mkdir local-ci-evidence
          git rev-parse HEAD > local-ci-evidence/revision.txt
          python --version > local-ci-evidence/python.txt
          python tracer.py > local-ci-evidence/tracer.json
          python -W error -m unittest -v > local-ci-evidence/tests.txt 2>&1 || {
            cat local-ci-evidence/tests.txt
            exit 1
          }
          cat local-ci-evidence/tests.txt
          python inventory_demo.py local-ci-evidence/inventory > local-ci-evidence/result.json
          cat local-ci-evidence/result.json
      - name: Publish qualification evidence
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: policy-runtime-qualification
          path: checkout/local-ci-evidence/
          if-no-files-found: error
